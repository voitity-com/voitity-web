services:
  voitity-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: voitity-web-app
    working_dir: /app/src
    ports:
      - "3001:3000"
    environment:
      - NODE_ENV=development
      - HOST=0.0.0.0
      - PORT=3000
    volumes:
      - ./src:/app/src
      - /app/src/node_modules
    command: npm run dev -- --host 0.0.0.0 --port 3000
