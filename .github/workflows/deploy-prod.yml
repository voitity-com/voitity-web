name: Deploy Web

on:
  push:
    branches:
      - prod

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: us-east-1
  AWS_ROLE_ARN: arn:aws:iam::139194331469:role/bigmelo-prod-github-actions-deploy-role
  WEB_ENV_SECRET_ID: bigmelo/prod/web/env
  WEB_BUCKET: bigmelo-prod-web-139194331469
  WEB_DISTRIBUTION_ID: E2WUNAZAZFZHYA
  PROFILE_DOMAIN_DISTRIBUTION_ID: ${{ vars.PROFILE_DOMAIN_DISTRIBUTION_ID }}
  WEB_FUNCTION_NAME: bigmelo-web-uri-rewrite

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Write production env
        run: |
          aws secretsmanager get-secret-value \
            --secret-id "$WEB_ENV_SECRET_ID" \
            --region "$AWS_REGION" \
            --query SecretString \
            --output text > .env.production

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Sync to S3
        run: |
          aws s3 sync dist "s3://$WEB_BUCKET" \
            --delete \
            --cache-control "public,max-age=31536000,immutable" \
            --exclude "*.html" \
            --exclude "robots.txt" \
            --exclude "sitemap.xml"
          aws s3 sync dist "s3://$WEB_BUCKET" \
            --delete \
            --exclude "*" \
            --include "*.html" \
            --cache-control "no-cache,no-store,must-revalidate" \
            --content-type "text/html"
          aws s3 cp dist/robots.txt "s3://$WEB_BUCKET/robots.txt" \
            --cache-control "public,max-age=300" \
            --content-type "text/plain; charset=utf-8"
          aws s3 cp dist/sitemap.xml "s3://$WEB_BUCKET/sitemap.xml" \
            --cache-control "public,max-age=300" \
            --content-type "application/xml; charset=utf-8"

      - name: Publish CloudFront route function
        run: |
          FUNCTION_ETAG="$(aws cloudfront describe-function \
            --name "$WEB_FUNCTION_NAME" \
            --stage DEVELOPMENT \
            --query ETag \
            --output text)"
          PUBLISH_ETAG="$(aws cloudfront update-function \
            --name "$WEB_FUNCTION_NAME" \
            --if-match "$FUNCTION_ETAG" \
            --function-config 'Comment=Canonical host and static SEO route rewrites,Runtime=cloudfront-js-2.0' \
            --function-code fileb://../infra/cloudfront/viewer-request.js \
            --query ETag \
            --output text)"
          aws cloudfront publish-function \
            --name "$WEB_FUNCTION_NAME" \
            --if-match "$PUBLISH_ETAG"

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "$WEB_DISTRIBUTION_ID" \
            --paths "/*"
          if [ -n "$PROFILE_DOMAIN_DISTRIBUTION_ID" ]; then
            TENANT_IDS="$(aws cloudfront list-distribution-tenants \
              --association-filter "DistributionId=$PROFILE_DOMAIN_DISTRIBUTION_ID" \
              --query 'DistributionTenantList[].Id' \
              --output text)"
            for TENANT_ID in $TENANT_IDS; do
              aws cloudfront create-invalidation-for-distribution-tenant \
                --id "$TENANT_ID" \
                --invalidation-batch "Paths={Quantity=1,Items=[\"/*\"]},CallerReference=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${TENANT_ID}"
            done
          fi
